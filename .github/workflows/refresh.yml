name: Refresh and publish

on:
  push:
    branches: [main]
    paths: [stores.json]
  schedule:
    - cron: '17 4 * * 0'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      publish_pilot:
        description: Publish the verified 42-store home-design sample
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hever-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        if: github.event_name != 'push' && inputs.publish_pilot != true
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        if: github.event_name != 'push' && inputs.publish_pilot != true
        run: python -m pip install 'beautifulsoup4==4.13.4'
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html style.css app.js dist/
      - name: Refresh merchant index
        if: github.event_name != 'push' && inputs.publish_pilot != true
        run: python refresh.py --output dist/stores.json
      - name: Use the locally refreshed catalog
        if: github.event_name == 'push'
        run: cp stores.json dist/stores.json
      - name: Use verified pilot catalog
        if: inputs.publish_pilot == true
        run: cp pilot-stores.json dist/stores.json
      - name: Upload site bundle
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
